name: Deploy Frontend Shortener

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "terraform/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - ".github/workflows/deploy-frontend-shortener.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_IN_AUTOMATION: "true"

jobs:
  deploy:
    name: Build and deploy shortener frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.SHORTEN_API_URL || vars.SHORTEN_API_URL || 'https://e88mqe3ind.execute-api.us-east-1.amazonaws.com/dev' }}
          VITE_REDIRECT_API_URL: ${{ secrets.REDIRECT_API_URL || vars.REDIRECT_API_URL || 'https://unxbca7x7a.execute-api.us-east-1.amazonaws.com/dev' }}
          VITE_STATS_API_URL: ${{ secrets.STATS_API_URL || vars.STATS_API_URL || 'https://2g1p050mzf.execute-api.us-east-1.amazonaws.com/dev' }}

      - name: Terraform init
        run: terraform -chdir=terraform init

      - name: Find existing frontend infrastructure
        id: existing
        run: |
          BUCKET="frontend-shortener-dev"
          DISTRIBUTION_ID="$(aws cloudfront list-distributions --query "DistributionList.Items[?Comment=='frontend-shortener dev frontend'].Id | [0]" --output text)"

          if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null && [ "$DISTRIBUTION_ID" != "None" ] && [ -n "$DISTRIBUTION_ID" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"
            echo "distribution_id=$DISTRIBUTION_ID" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Terraform apply
        if: steps.existing.outputs.found != 'true'
        run: terraform -chdir=terraform apply -auto-approve

      - name: Read Terraform outputs
        id: tf
        if: steps.existing.outputs.found != 'true'
        run: |
          echo "bucket=$(terraform -chdir=terraform output -raw bucket_name)" >> "$GITHUB_OUTPUT"
          echo "distribution_id=$(terraform -chdir=terraform output -raw cloudfront_distribution_id)" >> "$GITHUB_OUTPUT"

      - name: Resolve deployment targets
        id: target
        run: |
          echo "bucket=${{ steps.existing.outputs.bucket || steps.tf.outputs.bucket }}" >> "$GITHUB_OUTPUT"
          echo "distribution_id=${{ steps.existing.outputs.distribution_id || steps.tf.outputs.distribution_id }}" >> "$GITHUB_OUTPUT"

      - name: Upload static assets
        run: aws s3 sync dist "s3://${{ steps.target.outputs.bucket }}" --delete --cache-control "public,max-age=31536000,immutable" --exclude "index.html"

      - name: Upload index
        run: aws s3 cp dist/index.html "s3://${{ steps.target.outputs.bucket }}/index.html" --cache-control "no-cache,no-store,must-revalidate" --content-type "text/html"

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "${{ steps.target.outputs.distribution_id }}" --paths "/*"
